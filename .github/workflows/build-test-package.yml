name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-release-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Visual Studio 2019 Build Tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found on the GitHub runner."
          }

          $vs2019 = & $vswhere -products * -version "[16.0,17.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -latest -property installationPath 2>$null

          if (-not $vs2019) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP "vs_buildtools_2019.exe"
            Invoke-WebRequest -Uri "https://aka.ms/vs/16/release/vs_buildtools.exe" -OutFile $bootstrapper -UseBasicParsing

            $arguments = @(
              "--quiet",
              "--wait",
              "--norestart",
              "--nocache",
              "--installPath",
              "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2019\BuildTools",
              "--add",
              "Microsoft.VisualStudio.Workload.VCTools",
              "--add",
              "Microsoft.VisualStudio.Component.Windows10SDK.19041",
              "--includeRecommended"
            )

            $installer = Start-Process -FilePath $bootstrapper -ArgumentList $arguments -Wait -PassThru
            if ($installer.ExitCode -notin @(0, 3010)) {
              throw "Visual Studio 2019 Build Tools installation failed: exit code $($installer.ExitCode)"
            }

            $vs2019 = & $vswhere -products * -version "[16.0,17.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -latest -property installationPath 2>$null
          }

          if (-not $vs2019) {
            throw "Visual Studio 2019 with VC tools is still unavailable."
          }

          $vs2019 = $vs2019 | Select-Object -First 1
          Write-Host "Visual Studio 2019: $vs2019"
          Add-Content -Path $env:GITHUB_ENV -Value "GYP_MSVS_OVERRIDE_PATH=$vs2019"
          Add-Content -Path $env:GITHUB_ENV -Value "VSINSTALLDIR=$vs2019"
          & $vswhere -products * -version "[16.0,17.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -latest -property displayName,installationVersion

      - name: Cache Flutter 3.16.9 SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter-3.16.9
          key: flutter-windows-3.16.9-x64

      - name: Setup Flutter 3.16.9
        shell: pwsh
        run: |
          $flutterRoot = Join-Path $env:RUNNER_TEMP "flutter-3.16.9"
          if (-not (Test-Path (Join-Path $flutterRoot "bin\flutter.bat"))) {
            git clone --depth 1 --branch 3.16.9 https://github.com/flutter/flutter.git $flutterRoot
          }

          if (-not (Test-Path (Join-Path $flutterRoot "bin\flutter.bat"))) {
            throw "Flutter 3.16.9 SDK was not prepared: $flutterRoot"
          }

          $flutterBin = Join-Path $flutterRoot "bin"
          Add-Content -Path $env:GITHUB_PATH -Value $flutterBin

          & (Join-Path $flutterBin "flutter.bat") --version
          & (Join-Path $flutterBin "flutter.bat") precache --windows

      - name: Verify legacy-compatible source
        shell: pwsh
        run: |
          $flutterVersion = flutter --version
          if (($flutterVersion -join ' ') -notmatch "3\.16\.9") {
            throw "Unexpected Flutter version. Expected Flutter 3.16.9."
          }

          $manifest = Get-Content "windows/runner/runner.exe.manifest" -Raw
          foreach ($id in @(
            "{35138b9a-5d96-4fbd-8e2d-a2440225f93a}",
            "{4a2f28e3-53b9-4441-ba9c-d69d4a4a6e38}",
            "{1f676c76-80e1-4239-95bb-83d0f6d0da78}",
            "{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}"
          )) {
            if ($manifest -notmatch [regex]::Escape($id)) {
              throw "Windows compatibility GUID is missing: $id"
            }
          }

          if ((Get-Content "windows/runner/main.cpp" -Raw) -match "set_impeller_switch|ImpellerSwitch") {
            throw "Legacy Windows build must not use the newer Impeller API."
          }

          $withValuesMatches = @(git grep -n "withValues(" -- lib 2>$null)
          $grepExit = $LASTEXITCODE
          if ($grepExit -eq 0) {
            $withValuesMatches | ForEach-Object { Write-Host $_ }
            throw "Flutter 3.16.9 incompatible withValues API remains in lib."
          }
          if ($grepExit -eq 1) {
            # git grep uses exit code 1 for a valid "no matches" result.
            exit 0
          }
          throw "Unable to scan source for withValues API. git grep exit code: $grepExit"

      - name: Dart dependency resolution
        shell: pwsh
        run: |
          flutter --version
          dart --version
          dart pub get

      - name: Prepare Windows plugin links
        shell: pwsh
        run: |
          $configPath = ".dart_tool/package_config.json"
          $pluginCmake = "windows/flutter/generated_plugins.cmake"

          if (-not (Test-Path $configPath)) {
            throw "Dart package configuration was not generated: $configPath"
          }
          if (-not (Test-Path $pluginCmake)) {
            throw "Generated Windows plugin list is missing: $pluginCmake"
          }

          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $cmake = Get-Content $pluginCmake -Raw

          # Read only concrete names from both Flutter plugin lists. Do not
          # capture CMake loop variables such as ${plugin}.
          $pluginNames = @()
          foreach ($listName in @("FLUTTER_PLUGIN_LIST", "FLUTTER_FFI_PLUGIN_LIST")) {
            $escapedListName = [regex]::Escape($listName)
            $match = [regex]::Match(
              $cmake,
              "(?ms)list\(APPEND $escapedListName\s*(.*?)\)"
            )
            if ($match.Success) {
              $pluginNames += @(
                ($match.Groups[1].Value -split "\r?\n" |
                  ForEach-Object { $_.Trim() } |
                  Where-Object {
                    $_ -and $_ -notmatch '^\$\{.*\}
          $linkRoot = "windows/flutter/ephemeral/.plugin_symlinks"
          New-Item -ItemType Directory -Path $linkRoot -Force | Out-Null

          foreach ($pluginName in $pluginNames) {
            $package = $config.packages | Where-Object { $_.name -eq $pluginName } | Select-Object -First 1
            if ($null -eq $package) {
              throw "Package $pluginName is not present in .dart_tool/package_config.json"
            }

            $packageRoot = ([Uri]$package.rootUri).LocalPath
            $windowsRoot = Join-Path $packageRoot "windows"
            if (-not (Test-Path $windowsRoot)) {
              throw "Windows implementation for plugin $pluginName is missing: $windowsRoot"
            }

            $linkPath = Join-Path $linkRoot $pluginName
            if (Test-Path $linkPath) {
              Remove-Item $linkPath -Recurse -Force
            }

            New-Item -ItemType Junction -Path $linkPath -Target $packageRoot | Out-Null
            Write-Host "Linked $pluginName -> $packageRoot"
          }

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test --no-pub

      - name: Clean stale Windows CMake cache
        shell: pwsh
        run: |
          Remove-Item "build/windows/x64" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "build/native_assets" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build Windows x64
        run: flutter build windows --release --no-pub

      - name: Add offline Matcha TTS runtime and models
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $nativeDir = "native/espeak-ng"

          if (-not (Test-Path $nativeDir)) {
            throw "Native TTS directory was not found: $nativeDir"
          }

          $espeakDll = Join-Path $nativeDir "espeak-ng.dll"
          if (-not (Test-Path $espeakDll)) {
            throw "Required espeak-ng.dll is missing: $espeakDll"
          }
          Copy-Item $espeakDll $releaseDir -Force

          $dataSrc = Join-Path $nativeDir "espeak-ng-data"
          $dataDst = Join-Path $releaseDir "espeak-ng-data"
          if (-not (Test-Path $dataSrc)) {
            throw "Required espeak-ng-data directory is missing: $dataSrc"
          }
          if (Test-Path $dataDst) {
            Remove-Item $dataDst -Recurse -Force
          }
          Copy-Item $dataSrc $dataDst -Recurse -Force

          # Bundle the VS2019 v142 CRT for old Windows systems.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs2019 = & $vswhere -products * -version "[16.0,17.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -latest -property installationPath 2>$null | Select-Object -First 1
          if (-not $vs2019) {
            throw "Visual Studio 2019 installation path was not found."
          }

          $crtRoot = Get-ChildItem (Join-Path $vs2019 "VC\Redist\MSVC") -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $crtRoot) {
            throw "VC++ v142 redist directory was not found."
          }

          $crtDir = Join-Path $crtRoot.FullName "x64\Microsoft.VC142.CRT"
          if (-not (Test-Path $crtDir)) {
            throw "VC++ v142 x64 CRT directory was not found: $crtDir"
          }
          Copy-Item (Join-Path $crtDir "*.dll") $releaseDir -Force

          # Bundle Universal CRT files from the Windows SDK when available.
          $kitRedist = "${env:ProgramFiles(x86)}\Windows Kits\10\Redist"
          $ucrtBase = Get-ChildItem $kitRedist -Recurse -Filter "ucrtbase.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\ucrt\\DLLs\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($ucrtBase) {
            Copy-Item (Join-Path $ucrtBase.Directory.FullName "*.dll") $releaseDir -Force
            Write-Host "Bundled UCRT from $($ucrtBase.Directory.FullName)"
          } else {
            Write-Warning "Windows SDK UCRT app-local files were not found."
          }

          # Bundle d3dcompiler_47 for legacy Skia/ANGLE systems.
          $d3dCompiler = Get-ChildItem $kitRedist -Recurse -Filter "d3dcompiler_47.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($d3dCompiler) {
            Copy-Item $d3dCompiler.FullName $releaseDir -Force
            Write-Host "Bundled d3dcompiler_47.dll"
          } else {
            Write-Warning "d3dcompiler_47.dll was not found in the Windows SDK."
          }

          # Keep modern sherpa/ONNX binaries isolated. Legacy Windows never loads them.
          $matchaRuntimeDir = Join-Path $releaseDir "matcha-runtime"
          if (Test-Path $matchaRuntimeDir) {
            Remove-Item $matchaRuntimeDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $matchaRuntimeDir | Out-Null
          foreach ($file in @("sherpa-onnx-c-api.dll", "onnxruntime.dll")) {
            $source = Join-Path $releaseDir $file
            if (-not (Test-Path $source)) {
              throw "Generated sherpa runtime file is missing: $source"
            }
            Move-Item $source $matchaRuntimeDir -Force
          }

          $matchaArchive = Join-Path $env:RUNNER_TEMP "matcha-icefall-zh-baker.tar.bz2"
          $matchaRoot = Join-Path $env:RUNNER_TEMP "matcha-icefall-zh-baker"

          if (Test-Path $matchaArchive) {
            Remove-Item $matchaArchive -Force
          }
          if (Test-Path $matchaRoot) {
            Remove-Item $matchaRoot -Recurse -Force
          }

          $matchaUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/matcha-icefall-zh-baker.tar.bz2"
          Invoke-WebRequest -Uri $matchaUrl -OutFile $matchaArchive -UseBasicParsing
          if (-not (Test-Path $matchaArchive)) {
            throw "Matcha model archive was not downloaded."
          }

          tar.exe -xjf $matchaArchive -C $env:RUNNER_TEMP
          if (-not (Test-Path $matchaRoot)) {
            throw "Matcha model directory was not extracted: $matchaRoot"
          }

          $releaseMatcha = Join-Path $releaseDir "matcha-icefall-zh-baker"
          if (Test-Path $releaseMatcha) {
            Remove-Item $releaseMatcha -Recurse -Force
          }
          Copy-Item $matchaRoot $releaseMatcha -Recurse -Force

          $vocosUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/vocos-22khz-univ.onnx"
          $vocosPath = Join-Path $releaseDir "vocos-22khz-univ.onnx"
          if (Test-Path $vocosPath) {
            Remove-Item $vocosPath -Force
          }
          Invoke-WebRequest -Uri $vocosUrl -OutFile $vocosPath -UseBasicParsing

          $acousticPath = Join-Path $releaseMatcha "model-steps-3.onnx"
          $acousticSize = (Get-Item $acousticPath).Length
          $vocosSize = (Get-Item $vocosPath).Length
          if ($acousticSize -lt 70000000) {
            throw "Matcha acoustic model is incomplete: $acousticSize bytes"
          }
          if ($vocosSize -lt 50000000) {
            throw "Vocos model is incomplete: $vocosSize bytes"
          }

          foreach ($file in @(
            "model-steps-3.onnx",
            "lexicon.txt",
            "tokens.txt",
            "phone.fst",
            "date.fst",
            "number.fst"
          )) {
            if (-not (Test-Path (Join-Path $releaseMatcha $file))) {
              throw "Required Matcha file is missing: $file"
            }
          }

          Write-Host "Matcha acoustic model size: $acousticSize bytes"
          Write-Host "Vocos model size: $vocosSize bytes"

          $testNote = @(
            "Reader Windows x64 测试版",
            "",
            "本版本使用 sherpa-onnx Matcha Icefall zh-Baker 中文离线语音；Windows 7/8/8.1 自动使用内置 eSpeak 兼容路径，Windows 10/11 使用 Matcha。",
            "Matcha 声学模型 + Vocos 声码器约 123 MB。",
            "",
            "运行：双击 reader.exe",
            "",
            "Windows 右键打开：",
            "1. 首次运行 reader.exe 会自动安装右键菜单。",
            "2. 也可以运行 Install-Reader-Right-Click.cmd 手动安装。",
            "3. 在支持的 TXT / EPUB / MOBI / AZW3 / HTML / MD / FB2 / ODT / DOCX / 音频文件上右键，选择用 Reader 打开。",
            "4. Reader 会直接打开文件，不需要先进入 Reader 书架。",
            "5. 如果移动了 Reader 整个文件夹，再运行一次 Reader 或安装脚本即可更新路径。",
            "",
            "Matcha 模型文件位于 matcha-icefall-zh-baker 目录，Vocos 位于 Release 根目录；sherpa-onnx 原生运行库位于 matcha-runtime 目录。",
            "",
            "If Windows SmartScreen appears, choose More info and run. This is an unsigned test build."
          ) -join [Environment]::NewLine
          Set-Content -Path (Join-Path $releaseDir "README-Windows-Test.txt") -Value $testNote -Encoding UTF8

      - name: Verify Windows build
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release directory was not generated: $releaseDir"
          }

          $exe = Get-ChildItem -Path $releaseDir -Filter "reader.exe" -File | Select-Object -First 1
          if ($null -eq $exe) {
            throw "No Windows executable was found in $releaseDir"
          }

          $required = @(
            "reader.exe",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140.dll",
            "espeak-ng.dll",
            "vocos-22khz-univ.onnx",
            "d3dcompiler_47.dll",
            "espeak-ng-data",
            "matcha-runtime"
          )

          foreach ($item in $required) {
            if (-not (Test-Path (Join-Path $releaseDir $item))) {
              throw "Required release item is missing: $item"
            }
          }

          if (-not (Test-Path (Join-Path $releaseDir "ucrtbase.dll"))) {
            throw "Bundled ucrtbase.dll is missing."
          }

          $matchaRuntime = Join-Path $releaseDir "matcha-runtime"
          foreach ($item in @("sherpa-onnx-c-api.dll", "onnxruntime.dll")) {
            if (-not (Test-Path (Join-Path $matchaRuntime $item))) {
              throw "Matcha native runtime file is missing: $item"
            }
          }

          $matchaDir = Join-Path $releaseDir "matcha-icefall-zh-baker"
          foreach ($item in @("model-steps-3.onnx","lexicon.txt","tokens.txt","phone.fst","date.fst","number.fst")) {
            if (-not (Test-Path (Join-Path $matchaDir $item))) {
              throw "Required Matcha release item is missing: $item"
            }
          }

          Write-Host "Windows executable: $($exe.FullName)"
          Write-Host "Legacy runtime bundle and Matcha files verified."

      - name: Verify Matcha TTS synthesis
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "reader.exe"

          $selfTest = Start-Process -FilePath $exe -ArgumentList "--tts-self-test" -Wait -PassThru -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) {
            throw "Matcha TTS self-test failed with exit code $($selfTest.ExitCode)"
          }

      - name: Verify right-click registration command
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "reader.exe"

          $install = Start-Process -FilePath $exe -ArgumentList "--install-context-menu" -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "reader.exe --install-context-menu failed with exit code $($install.ExitCode)"
          }

          $regKey = "HKCU:\Software\Classes\SystemFileAssociations\.epub\shell\Reader"
          if (-not (Test-Path $regKey)) {
            throw "Reader context-menu registry key was not created: $regKey"
          }

          $commandKey = "$regKey\command"
          if (-not (Test-Path $commandKey)) {
            throw "Reader context-menu command key was not created: $commandKey"
          }

          $command = (Get-ItemProperty -Path $commandKey -Name "(default)")."(default)"
          Write-Host "Registered command: $command"

          $uninstall = Start-Process -FilePath $exe -ArgumentList "--uninstall-context-menu" -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) {
            throw "reader.exe --uninstall-context-menu failed with exit code $($uninstall.ExitCode)"
          }

          if (Test-Path $regKey) {
            throw "Reader context-menu registry key was not removed: $regKey"
          }

      - name: Create right-click install scripts
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"

          $installScript = @'
          @echo off
          setlocal
          "%~dp0reader.exe" --install-context-menu
          if errorlevel 1 (
            echo Reader right-click menu installation failed.
            pause
            exit /b 1
          )
          echo Reader right-click menu installed successfully.
          echo You can now right-click supported book/audio files and choose "用 Reader 打开".
          pause
          '@
          Set-Content -Path (Join-Path $releaseDir "Install-Reader-Right-Click.cmd") -Value $installScript -Encoding UTF8

          $uninstallScript = @'
          @echo off
          setlocal
          "%~dp0reader.exe" --uninstall-context-menu
          if errorlevel 1 (
            echo Reader right-click menu uninstall failed.
            pause
            exit /b 1
          )
          echo Reader right-click menu uninstalled successfully.
          pause
          '@
          Set-Content -Path (Join-Path $releaseDir "Uninstall-Reader-Right-Click.cmd") -Value $uninstallScript -Encoding UTF8

      - name: Verify native crash log recording
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "reader.exe"
          $logPath = Join-Path $env:LOCALAPPDATA "Reader\Reader-Crash.log"

          if (Test-Path $logPath) {
            Remove-Item $logPath -Force
          }

          $proc = Start-Process -FilePath $exe -ArgumentList "--native-crash-log-self-test" -Wait -PassThru -WindowStyle Hidden
          if ($proc.ExitCode -eq 0) {
            throw "Native crash self-test unexpectedly returned exit code 0."
          }

          if (-not (Test-Path $logPath)) {
            throw "Native crash log file was not created: $logPath"
          }

          $content = Get-Content -Path $logPath -Raw
          if ($content -notmatch "Windows 未处理异常 / 闪退") {
            throw "Native crash log does not contain the expected crash record."
          }

          Remove-Item $logPath -Force

      - name: Verify crash log recording
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "reader.exe"
          $logPath = Join-Path $env:LOCALAPPDATA "Reader\Reader-Crash.log"

          if (Test-Path $logPath) {
            Remove-Item $logPath -Force
          }

          $selfTest = Start-Process -FilePath $exe -ArgumentList "--crash-log-self-test" -Wait -PassThru -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) {
            throw "Crash log self-test failed with exit code $($selfTest.ExitCode)"
          }

          if (-not (Test-Path $logPath)) {
            throw "Crash log file was not created: $logPath"
          }

          $content = Get-Content -Path $logPath -Raw
          if ($content -notmatch "来源: SelfTest") {
            throw "Crash log does not contain the self-test error record."
          }

          Remove-Item $logPath -Force

      - name: Package Windows x64
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zip = "Reader_v1.3.9_Windows_x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "Windows package was not created: $zip"
          }

          Get-Item $zip | Format-List FullName, Length

      - name: Publish Windows x64 ZIP to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Reader_v1.3.9_Windows_x64.zip"
          $tag = "v1.3.9-windows-${{ github.run_number }}"
          $title = "Reader v1.3.9 Windows x64 兼容测试版 #${{ github.run_number }}"
          $notes = "Reader Windows 7-11 x64 兼容测试版（Win7/8/8.1 使用旧版 Skia/内置 eSpeak 兼容路径，Win10/11 保留 Matcha）。此版本使用 sherpa-onnx Matcha Icefall zh-Baker 中文离线语音模型。Windows 采用 CPU TTS，避免依赖独立显卡。下载后解压 ZIP，运行 reader.exe；首次运行会自动安装 Windows 右键打开菜单。也可以运行 Install-Reader-Right-Click.cmd 手动安装。之后可直接在支持的书籍/文档/音频文件上右键选择用 Reader 打开。本 Release 不包含 Android/APK。ZIP 内包含完整 Windows Release 程序、v142/UCRT 运行库、D3D 编译组件、Matcha Icefall zh-Baker 声学模型、Vocos 声码器、sherpa-onnx 运行库及 espeak-ng-data。错误日志位置：%LOCALAPPDATA%\Reader\Reader-Crash.log。Windows 默认关闭 Impeller，并在旧 Windows/基本显示适配器上自动使用软件渲染，优先兼容老显卡/旧驱动。注意：这是未签名的 Windows 测试版本，Windows SmartScreen 可能会提示风险。"

          if (-not (Test-Path $zip)) {
            throw "Windows ZIP was not created: $zip"
          }

          gh release create $tag $zip --title $title --notes $notes --target $env:GITHUB_SHA

                  })
              )
            }
          }
          $pluginNames = $pluginNames | Sort-Object -Unique

          $linkRoot = "windows/flutter/ephemeral/.plugin_symlinks"
          New-Item -ItemType Directory -Path $linkRoot -Force | Out-Null

          foreach ($pluginName in $pluginNames) {
            $package = $config.packages | Where-Object { $_.name -eq $pluginName } | Select-Object -First 1
            if ($null -eq $package) {
              throw "Package $pluginName is not present in .dart_tool/package_config.json"
            }

            $packageRoot = ([Uri]$package.rootUri).LocalPath
            $windowsRoot = Join-Path $packageRoot "windows"
            if (-not (Test-Path $windowsRoot)) {
              throw "Windows implementation for plugin $pluginName is missing: $windowsRoot"
            }

            $linkPath = Join-Path $linkRoot $pluginName
            if (Test-Path $linkPath) {
              Remove-Item $linkPath -Recurse -Force
            }

            New-Item -ItemType Junction -Path $linkPath -Target $packageRoot | Out-Null
            Write-Host "Linked $pluginName -> $packageRoot"
          }

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test --no-pub

      - name: Clean stale Windows CMake cache
        shell: pwsh
        run: |
          Remove-Item "build/windows/x64" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "build/native_assets" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build Windows x64
        run: flutter build windows --release --no-pub

      - name: Add offline Matcha TTS runtime and models
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $nativeDir = "native/espeak-ng"

          if (-not (Test-Path $nativeDir)) {
            throw "Native TTS directory was not found: $nativeDir"
          }

          $espeakDll = Join-Path $nativeDir "espeak-ng.dll"
          if (-not (Test-Path $espeakDll)) {
            throw "Required espeak-ng.dll is missing: $espeakDll"
          }
          Copy-Item $espeakDll $releaseDir -Force

          $dataSrc = Join-Path $nativeDir "espeak-ng-data"
          $dataDst = Join-Path $releaseDir "espeak-ng-data"
          if (-not (Test-Path $dataSrc)) {
            throw "Required espeak-ng-data directory is missing: $dataSrc"
          }
          if (Test-Path $dataDst) {
            Remove-Item $dataDst -Recurse -Force
          }
          Copy-Item $dataSrc $dataDst -Recurse -Force

          # Bundle the VS2019 v142 CRT for old Windows systems.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs2019 = & $vswhere -products * -version "[16.0,17.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -latest -property installationPath 2>$null | Select-Object -First 1
          if (-not $vs2019) {
            throw "Visual Studio 2019 installation path was not found."
          }

          $crtRoot = Get-ChildItem (Join-Path $vs2019 "VC\Redist\MSVC") -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $crtRoot) {
            throw "VC++ v142 redist directory was not found."
          }

          $crtDir = Join-Path $crtRoot.FullName "x64\Microsoft.VC142.CRT"
          if (-not (Test-Path $crtDir)) {
            throw "VC++ v142 x64 CRT directory was not found: $crtDir"
          }
          Copy-Item (Join-Path $crtDir "*.dll") $releaseDir -Force

          # Bundle Universal CRT files from the Windows SDK when available.
          $kitRedist = "${env:ProgramFiles(x86)}\Windows Kits\10\Redist"
          $ucrtBase = Get-ChildItem $kitRedist -Recurse -Filter "ucrtbase.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\ucrt\\DLLs\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($ucrtBase) {
            Copy-Item (Join-Path $ucrtBase.Directory.FullName "*.dll") $releaseDir -Force
            Write-Host "Bundled UCRT from $($ucrtBase.Directory.FullName)"
          } else {
            Write-Warning "Windows SDK UCRT app-local files were not found."
          }

          # Bundle d3dcompiler_47 for legacy Skia/ANGLE systems.
          $d3dCompiler = Get-ChildItem $kitRedist -Recurse -Filter "d3dcompiler_47.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($d3dCompiler) {
            Copy-Item $d3dCompiler.FullName $releaseDir -Force
            Write-Host "Bundled d3dcompiler_47.dll"
          } else {
            Write-Warning "d3dcompiler_47.dll was not found in the Windows SDK."
          }

          # Keep modern sherpa/ONNX binaries isolated. Legacy Windows never loads them.
          $matchaRuntimeDir = Join-Path $releaseDir "matcha-runtime"
          if (Test-Path $matchaRuntimeDir) {
            Remove-Item $matchaRuntimeDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $matchaRuntimeDir | Out-Null
          foreach ($file in @("sherpa-onnx-c-api.dll", "onnxruntime.dll")) {
            $source = Join-Path $releaseDir $file
            if (-not (Test-Path $source)) {
              throw "Generated sherpa runtime file is missing: $source"
            }
            Move-Item $source $matchaRuntimeDir -Force
          }

          $matchaArchive = Join-Path $env:RUNNER_TEMP "matcha-icefall-zh-baker.tar.bz2"
          $matchaRoot = Join-Path $env:RUNNER_TEMP "matcha-icefall-zh-baker"

          if (Test-Path $matchaArchive) {
            Remove-Item $matchaArchive -Force
          }
          if (Test-Path $matchaRoot) {
            Remove-Item $matchaRoot -Recurse -Force
          }

          $matchaUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/matcha-icefall-zh-baker.tar.bz2"
          Invoke-WebRequest -Uri $matchaUrl -OutFile $matchaArchive -UseBasicParsing
          if (-not (Test-Path $matchaArchive)) {
            throw "Matcha model archive was not downloaded."
          }

          tar.exe -xjf $matchaArchive -C $env:RUNNER_TEMP
          if (-not (Test-Path $matchaRoot)) {
            throw "Matcha model directory was not extracted: $matchaRoot"
          }

          $releaseMatcha = Join-Path $releaseDir "matcha-icefall-zh-baker"
          if (Test-Path $releaseMatcha) {
            Remove-Item $releaseMatcha -Recurse -Force
          }
          Copy-Item $matchaRoot $releaseMatcha -Recurse -Force

          $vocosUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/vocos-22khz-univ.onnx"
          $vocosPath = Join-Path $releaseDir "vocos-22khz-univ.onnx"
          if (Test-Path $vocosPath) {
            Remove-Item $vocosPath -Force
          }
          Invoke-WebRequest -Uri $vocosUrl -OutFile $vocosPath -UseBasicParsing

          $acousticPath = Join-Path $releaseMatcha "model-steps-3.onnx"
          $acousticSize = (Get-Item $acousticPath).Length
          $vocosSize = (Get-Item $vocosPath).Length
          if ($acousticSize -lt 70000000) {
            throw "Matcha acoustic model is incomplete: $acousticSize bytes"
          }
          if ($vocosSize -lt 50000000) {
            throw "Vocos model is incomplete: $vocosSize bytes"
          }

          foreach ($file in @(
            "model-steps-3.onnx",
            "lexicon.txt",
            "tokens.txt",
            "phone.fst",
            "date.fst",
            "number.fst"
          )) {
            if (-not (Test-Path (Join-Path $releaseMatcha $file))) {
              throw "Required Matcha file is missing: $file"
            }
          }

          Write-Host "Matcha acoustic model size: $acousticSize bytes"
          Write-Host "Vocos model size: $vocosSize bytes"

          $testNote = @(
            "Reader Windows x64 测试版",
            "",
            "本版本使用 sherpa-onnx Matcha Icefall zh-Baker 中文离线语音；Windows 7/8/8.1 自动使用内置 eSpeak 兼容路径，Windows 10/11 使用 Matcha。",
            "Matcha 声学模型 + Vocos 声码器约 123 MB。",
            "",
            "运行：双击 reader.exe",
            "",
            "Windows 右键打开：",
            "1. 首次运行 reader.exe 会自动安装右键菜单。",
            "2. 也可以运行 Install-Reader-Right-Click.cmd 手动安装。",
            "3. 在支持的 TXT / EPUB / MOBI / AZW3 / HTML / MD / FB2 / ODT / DOCX / 音频文件上右键，选择用 Reader 打开。",
            "4. Reader 会直接打开文件，不需要先进入 Reader 书架。",
            "5. 如果移动了 Reader 整个文件夹，再运行一次 Reader 或安装脚本即可更新路径。",
            "",
            "Matcha 模型文件位于 matcha-icefall-zh-baker 目录，Vocos 位于 Release 根目录；sherpa-onnx 原生运行库位于 matcha-runtime 目录。",
            "",
            "If Windows SmartScreen appears, choose More info and run. This is an unsigned test build."
          ) -join [Environment]::NewLine
          Set-Content -Path (Join-Path $releaseDir "README-Windows-Test.txt") -Value $testNote -Encoding UTF8

      - name: Verify Windows build
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release directory was not generated: $releaseDir"
          }

          $exe = Get-ChildItem -Path $releaseDir -Filter "reader.exe" -File | Select-Object -First 1
          if ($null -eq $exe) {
            throw "No Windows executable was found in $releaseDir"
          }

          $required = @(
            "reader.exe",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140.dll",
            "espeak-ng.dll",
            "vocos-22khz-univ.onnx",
            "d3dcompiler_47.dll",
            "espeak-ng-data",
            "matcha-runtime"
          )

          foreach ($item in $required) {
            if (-not (Test-Path (Join-Path $releaseDir $item))) {
              throw "Required release item is missing: $item"
            }
          }

          if (-not (Test-Path (Join-Path $releaseDir "ucrtbase.dll"))) {
            throw "Bundled ucrtbase.dll is missing."
          }

          $matchaRuntime = Join-Path $releaseDir "matcha-runtime"
          foreach ($item in @("sherpa-onnx-c-api.dll", "onnxruntime.dll")) {
            if (-not (Test-Path (Join-Path $matchaRuntime $item))) {
              throw "Matcha native runtime file is missing: $item"
            }
          }

          $matchaDir = Join-Path $releaseDir "matcha-icefall-zh-baker"
          foreach ($item in @("model-steps-3.onnx","lexicon.txt","tokens.txt","phone.fst","date.fst","number.fst")) {
            if (-not (Test-Path (Join-Path $matchaDir $item))) {
              throw "Required Matcha release item is missing: $item"
            }
          }

          Write-Host "Windows executable: $($exe.FullName)"
          Write-Host "Legacy runtime bundle and Matcha files verified."

      - name: Verify Matcha TTS synthesis
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "reader.exe"

          $selfTest = Start-Process -FilePath $exe -ArgumentList "--tts-self-test" -Wait -PassThru -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) {
            throw "Matcha TTS self-test failed with exit code $($selfTest.ExitCode)"
          }

      - name: Verify right-click registration command
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "reader.exe"

          $install = Start-Process -FilePath $exe -ArgumentList "--install-context-menu" -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "reader.exe --install-context-menu failed with exit code $($install.ExitCode)"
          }

          $regKey = "HKCU:\Software\Classes\SystemFileAssociations\.epub\shell\Reader"
          if (-not (Test-Path $regKey)) {
            throw "Reader context-menu registry key was not created: $regKey"
          }

          $commandKey = "$regKey\command"
          if (-not (Test-Path $commandKey)) {
            throw "Reader context-menu command key was not created: $commandKey"
          }

          $command = (Get-ItemProperty -Path $commandKey -Name "(default)")."(default)"
          Write-Host "Registered command: $command"

          $uninstall = Start-Process -FilePath $exe -ArgumentList "--uninstall-context-menu" -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) {
            throw "reader.exe --uninstall-context-menu failed with exit code $($uninstall.ExitCode)"
          }

          if (Test-Path $regKey) {
            throw "Reader context-menu registry key was not removed: $regKey"
          }

      - name: Create right-click install scripts
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"

          $installScript = @'
          @echo off
          setlocal
          "%~dp0reader.exe" --install-context-menu
          if errorlevel 1 (
            echo Reader right-click menu installation failed.
            pause
            exit /b 1
          )
          echo Reader right-click menu installed successfully.
          echo You can now right-click supported book/audio files and choose "用 Reader 打开".
          pause
          '@
          Set-Content -Path (Join-Path $releaseDir "Install-Reader-Right-Click.cmd") -Value $installScript -Encoding UTF8

          $uninstallScript = @'
          @echo off
          setlocal
          "%~dp0reader.exe" --uninstall-context-menu
          if errorlevel 1 (
            echo Reader right-click menu uninstall failed.
            pause
            exit /b 1
          )
          echo Reader right-click menu uninstalled successfully.
          pause
          '@
          Set-Content -Path (Join-Path $releaseDir "Uninstall-Reader-Right-Click.cmd") -Value $uninstallScript -Encoding UTF8

      - name: Verify native crash log recording
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "reader.exe"
          $logPath = Join-Path $env:LOCALAPPDATA "Reader\Reader-Crash.log"

          if (Test-Path $logPath) {
            Remove-Item $logPath -Force
          }

          $proc = Start-Process -FilePath $exe -ArgumentList "--native-crash-log-self-test" -Wait -PassThru -WindowStyle Hidden
          if ($proc.ExitCode -eq 0) {
            throw "Native crash self-test unexpectedly returned exit code 0."
          }

          if (-not (Test-Path $logPath)) {
            throw "Native crash log file was not created: $logPath"
          }

          $content = Get-Content -Path $logPath -Raw
          if ($content -notmatch "Windows 未处理异常 / 闪退") {
            throw "Native crash log does not contain the expected crash record."
          }

          Remove-Item $logPath -Force

      - name: Verify crash log recording
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "reader.exe"
          $logPath = Join-Path $env:LOCALAPPDATA "Reader\Reader-Crash.log"

          if (Test-Path $logPath) {
            Remove-Item $logPath -Force
          }

          $selfTest = Start-Process -FilePath $exe -ArgumentList "--crash-log-self-test" -Wait -PassThru -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) {
            throw "Crash log self-test failed with exit code $($selfTest.ExitCode)"
          }

          if (-not (Test-Path $logPath)) {
            throw "Crash log file was not created: $logPath"
          }

          $content = Get-Content -Path $logPath -Raw
          if ($content -notmatch "来源: SelfTest") {
            throw "Crash log does not contain the self-test error record."
          }

          Remove-Item $logPath -Force

      - name: Package Windows x64
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zip = "Reader_v1.3.9_Windows_x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "Windows package was not created: $zip"
          }

          Get-Item $zip | Format-List FullName, Length

      - name: Publish Windows x64 ZIP to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Reader_v1.3.9_Windows_x64.zip"
          $tag = "v1.3.9-windows-${{ github.run_number }}"
          $title = "Reader v1.3.9 Windows x64 兼容测试版 #${{ github.run_number }}"
          $notes = "Reader Windows 7-11 x64 兼容测试版（Win7/8/8.1 使用旧版 Skia/内置 eSpeak 兼容路径，Win10/11 保留 Matcha）。此版本使用 sherpa-onnx Matcha Icefall zh-Baker 中文离线语音模型。Windows 采用 CPU TTS，避免依赖独立显卡。下载后解压 ZIP，运行 reader.exe；首次运行会自动安装 Windows 右键打开菜单。也可以运行 Install-Reader-Right-Click.cmd 手动安装。之后可直接在支持的书籍/文档/音频文件上右键选择用 Reader 打开。本 Release 不包含 Android/APK。ZIP 内包含完整 Windows Release 程序、v142/UCRT 运行库、D3D 编译组件、Matcha Icefall zh-Baker 声学模型、Vocos 声码器、sherpa-onnx 运行库及 espeak-ng-data。错误日志位置：%LOCALAPPDATA%\Reader\Reader-Crash.log。Windows 默认关闭 Impeller，并在旧 Windows/基本显示适配器上自动使用软件渲染，优先兼容老显卡/旧驱动。注意：这是未签名的 Windows 测试版本，Windows SmartScreen 可能会提示风险。"

          if (-not (Test-Path $zip)) {
            throw "Windows ZIP was not created: $zip"
          }

          gh release create $tag $zip --title $title --notes $notes --target $env:GITHUB_SHA
