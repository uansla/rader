name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-release-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows x64
        run: flutter build windows --release

      - name: Add offline TTS runtime files
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $nativeDir = "native/espeak-ng"

          if (-not (Test-Path $nativeDir)) {
            throw "Native TTS directory was not found: $nativeDir"
          }

          foreach ($file in @("espeak-ng.dll", "onnxruntime.dll", "reader_tts.dll", "zh_CN-huayan-medium.onnx.json")) {
            $src = Join-Path $nativeDir $file
            if (-not (Test-Path $src)) {
              throw "Required TTS file is missing: $src"
            }
            Copy-Item $src $releaseDir -Force
          }

          $dataSrc = Join-Path $nativeDir "espeak-ng-data"
          $dataDst = Join-Path $releaseDir "espeak-ng-data"
          if (-not (Test-Path $dataSrc)) {
            throw "Required espeak-ng-data directory is missing: $dataSrc"
          }
          if (Test-Path $dataDst) {
            Remove-Item $dataDst -Recurse -Force
          }
          Copy-Item $dataSrc $dataDst -Recurse -Force

          $modelUrl = "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/zh/zh_CN/huayan/medium/zh_CN-huayan-medium.onnx?download=true"
          $modelPath = Join-Path $releaseDir "zh_CN-huayan-medium.onnx"
          Invoke-WebRequest -Uri $modelUrl -OutFile $modelPath -UseBasicParsing

          $modelSize = (Get-Item $modelPath).Length
          if ($modelSize -lt 50000000) {
            throw "Piper ONNX model is incomplete: $modelSize bytes"
          }

          $testNote = @(
            "Reader Windows x64 测试版",
            "",
            "运行：双击 reader.exe",
            "",
            "Windows 右键打开：",
            "1. 首次运行 reader.exe 会自动安装右键菜单。",
            "2. 也可以运行 Install-Reader-Right-Click.cmd 手动安装。",
            "3. 在支持的 TXT / EPUB / MOBI / AZW3 / HTML / MD / FB2 / ODT / DOCX / 音频文件上右键，选择“用 Reader 打开”。",
            "4. Reader 会直接打开文件，不需要先进入 Reader 书架。",
            "5. 如果移动了 Reader 整个文件夹，再运行一次 Reader 或安装脚本即可更新路径。",
            "",
            "本版本包含："
            "- Windows x64 Flutter Release 程序",
            "- 离线中文 Piper Huayan Medium TTS 模型",
            "- reader_tts.dll / onnxruntime.dll / espeak-ng.dll",
            "- espeak-ng-data",
            "- ODT / DOCX 阅读支持（以程序实际功能为准）",
            "",
            "If Windows SmartScreen appears, choose More info and run. This is an unsigned test build."
          ) -join [Environment]::NewLine
          Set-Content -Path (Join-Path $releaseDir "README-Windows-Test.txt") -Value $testNote -Encoding UTF8

      - name: Verify Windows build
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release directory was not generated: $releaseDir"
          }

          $exe = Get-ChildItem -Path $releaseDir -Filter "reader.exe" -File | Select-Object -First 1
          if ($null -eq $exe) {
            throw "No Windows executable was found in $releaseDir"
          }

          Write-Host "Windows executable: $($exe.FullName)"
          $required = @(
            "reader.exe",
            "reader_tts.dll",
            "onnxruntime.dll",
            "espeak-ng.dll",
            "zh_CN-huayan-medium.onnx",
            "zh_CN-huayan-medium.onnx.json",
            "espeak-ng-data"
          )
          foreach ($item in $required) {
            if (-not (Test-Path (Join-Path $releaseDir $item))) {
              throw "Required release item is missing: $item"
            }
          }

          Write-Host "Build directory size:"
          (Get-ChildItem -Path $releaseDir -Recurse -File |
            Measure-Object -Property Length -Sum).Sum

      - name: Verify right-click registration command
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "reader.exe"

          & $exe --install-context-menu
          if ($LASTEXITCODE -ne 0) {
            throw "reader.exe --install-context-menu failed with exit code $LASTEXITCODE"
          }

          $regKey = "HKCU:\Software\Classes\SystemFileAssociations\.epub\shell\Reader"
          if (-not (Test-Path $regKey)) {
            throw "Reader context-menu registry key was not created: $regKey"
          }

          $commandKey = "$regKey\command"
          if (-not (Test-Path $commandKey)) {
            throw "Reader context-menu command key was not created: $commandKey"
          }

          $command = (Get-ItemProperty -Path $commandKey -Name '(default)').'(default)'
          Write-Host "Registered command: $command"

          & $exe --uninstall-context-menu
          if ($LASTEXITCODE -ne 0) {
            throw "reader.exe --uninstall-context-menu failed with exit code $LASTEXITCODE"
          }

          if (Test-Path $regKey) {
            throw "Reader context-menu registry key was not removed: $regKey"
          }

      - name: Create right-click install scripts
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"

          $installScript = @'
          @echo off
          setlocal
          "%~dp0reader.exe" --install-context-menu
          if errorlevel 1 (
            echo Reader right-click menu installation failed.
            pause
            exit /b 1
          )
          echo Reader right-click menu installed successfully.
          echo You can now right-click supported book/audio files and choose "用 Reader 打开".
          pause
          '@
          Set-Content -Path (Join-Path $releaseDir "Install-Reader-Right-Click.cmd") -Value $installScript -Encoding UTF8

          $uninstallScript = @'
          @echo off
          setlocal
          "%~dp0reader.exe" --uninstall-context-menu
          if errorlevel 1 (
            echo Reader right-click menu uninstall failed.
            pause
            exit /b 1
          )
          echo Reader right-click menu uninstalled successfully.
          pause
          '@
          Set-Content -Path (Join-Path $releaseDir "Uninstall-Reader-Right-Click.cmd") -Value $uninstallScript -Encoding UTF8

      - name: Package Windows x64
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zip = "Reader_v1.3.1_Windows_x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "Windows package was not created: $zip"
          }

          Write-Host "Package created: $zip"
          Get-Item $zip | Format-List FullName, Length

      - name: Publish Windows x64 ZIP to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Reader_v1.3.1_Windows_x64.zip"
          $tag = "v1.3.1-windows-${{ github.run_number }}"
          $title = "Reader v1.3.1 Windows x64 测试版 #${{ github.run_number }}"

          if (-not (Test-Path $zip)) {
            throw "Windows ZIP was not created: $zip"
          }

          gh release create $tag $zip `
            --title $title `
            --notes "Reader Windows x64 测试版。下载后解压 ZIP，运行 reader.exe；首次运行会自动安装 Windows 右键打开菜单。也可以运行 Install-Reader-Right-Click.cmd 手动安装。之后可直接在支持的书籍/文档/音频文件上右键选择“用 Reader 打开”。本 Release 不包含 Android/APK。ZIP 内包含完整 Windows Release 程序、离线中文 TTS 运行库、Piper Huayan Medium 模型及 espeak-ng-data。注意：这是未签名的 Windows 测试版本，Windows SmartScreen 可能会提示风险。" `
            --target $env:GITHUB_SHA
