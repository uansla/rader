name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows x64
        run: flutter build windows --release

      - name: Verify Windows build
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release directory was not generated: $releaseDir"
          }

          $exe = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File | Select-Object -First 1
          if ($null -eq $exe) {
            throw "No Windows executable was found in $releaseDir"
          }

          Write-Host "Windows executable: $($exe.FullName)"
          Write-Host "Build directory size:"
          (Get-ChildItem -Path $releaseDir -Recurse -File |
            Measure-Object -Property Length -Sum).Sum

      - name: Package Windows x64
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zip = "Reader_v1.3.0_Windows_x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "Windows package was not created: $zip"
          }

          Write-Host "Package created: $zip"
          Get-Item $zip | Format-List FullName, Length

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reader_v1.3.0_Windows_x64
          path: Reader_v1.3.0_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
